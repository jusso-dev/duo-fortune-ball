# Reproducible Xcode project. Generate with: xcodegen generate
name: FoldFortune
options:
  bundleIdPrefix: dev.jusso
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
packages:
  FortuneCore:
    path: Packages/FortuneCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FoldFortune:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - "**/*.md"
    dependencies:
      - package: FortuneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.duofortuneball
        PRODUCT_NAME: FoldFortune
        INFOPLIST_KEY_CFBundleDisplayName: Fold Fortune
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  FoldFortuneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: FoldFortune
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.duofortuneball.tests
  FoldFortuneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: FoldFortune
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.duofortuneball.uitests
schemes:
  FoldFortune:
    build:
      targets:
        FoldFortune: all
    test:
      targets:
        - FoldFortuneTests
        # FortuneCoreTests run once, in CI's `swift test` step, not again here.
  # Captures docs/screenshots. See README "Screenshots".
  FoldFortuneScreenshots:
    build:
      targets:
        FoldFortune: all
        FoldFortuneUITests: [test]
    test:
      targets:
        - FoldFortuneUITests
