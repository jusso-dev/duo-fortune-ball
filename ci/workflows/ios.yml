# Proposed GitHub Actions workflow.
# The repo token cannot write .github/workflows, so this lives in ci/workflows.
# Move it to .github/workflows/ios.yml to enable it (see the tracking issue).
name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: FortuneCore (swift test, Linux)
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test FortuneCore
        working-directory: Packages/FortuneCore
        run: |
          swift build
          swift test --parallel

  app-macos:
    name: App (xcodebuild build and test)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen if missing
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; print(ids[-1] if ids else "")')
          test -n "$SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project FoldFortune.xcodeproj \
            -scheme FoldFortune \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
