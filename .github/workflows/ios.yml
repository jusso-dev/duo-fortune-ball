name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: FortuneCore tests and app build (hosted Xcode 27)
    # Hosted arm64 preview image with Xcode 27.0 and 27.2 beta, iOS 27.1 SDK and runtime.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: List installed Xcodes and SDKs
        run: |
          ls -d /Applications/Xcode*.app || true
          for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            echo "== $x"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version || true
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -i iphonesimulator || true
          done

      # The app targets iOS 27.1, the first SDK with the iPhone Duo hinge APIs
      # (DeviceHinge, onHingeChange). Prefer released Xcodes (newest first) and
      # only fall back to betas or release candidates. Symlinks such as
      # Xcode_27.1.app are skipped so each real app is checked once.
      - name: Select Xcode with the iPhone Duo SDK (released first)
        env:
          MIN_SIM_SDK: "27.1"
        run: |
          set -euo pipefail
          picked=""
          all=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -t_ -k2 -V -r)
          for x in $(echo "$all" | grep -viE 'beta|candidate') $(echo "$all" | grep -iE 'beta|candidate'); do
            [ -L "$x" ] && continue
            sdk=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || echo 0)
            echo "$x -> iphonesimulator SDK $sdk"
            if [ "$(printf '%s\n%s\n' "$MIN_SIM_SDK" "$sdk" | sort -V | head -n1)" = "$MIN_SIM_SDK" ]; then
              picked="$x"; break
            fi
          done
          if [ -z "$picked" ]; then
            echo "::error::No Xcode on this runner image has an iOS $MIN_SIM_SDK+ simulator SDK (needed for the iPhone Duo hinge APIs)."
            exit 1
          fi
          case "$picked" in *[Bb]eta*|*[Cc]andidate*) echo "::warning::No released Xcode has the iOS $MIN_SIM_SDK SDK on this image, so using $picked." ;; esac
          sudo xcode-select -s "$picked/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"

      - name: FortuneCore swift test
        working-directory: Packages/FortuneCore
        run: swift test --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The image only ships the iOS 27.0 simulator runtime. Keep the runtime
      # image for the selected Xcode build in the Actions cache so later runs
      # import it instead of downloading it again.
      - name: Restore cached iOS simulator runtime
        id: rtcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sim-runtime
          key: ios-sim-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_BUILD }}

      - name: Ensure an iOS 27.1+ simulator runtime
        id: runtime
        run: |
          has_rt() {
            xcrun simctl list -j runtimes | python3 -c '
          import json, re, sys
          ok = any(r.get("platform", "iOS") == "iOS" and r.get("isAvailable", True)
                   and tuple(int(x) for x in re.findall(r"\d+", r["version"])[:2]) >= (27, 1)
                   for r in json.load(sys.stdin)["runtimes"])
          sys.exit(0 if ok else 1)
          '
          }
          if has_rt; then echo "iOS 27.1+ runtime already installed"; exit 0; fi
          dmg=$(ls ~/sim-runtime/*.dmg 2>/dev/null | head -n1 || true)
          if [ -n "$dmg" ]; then
            echo "Importing cached runtime $dmg"
            xcodebuild -importPlatform "$dmg" || { echo "Cached runtime failed to import, downloading instead"; rm -rf ~/sim-runtime; dmg=""; }
          fi
          if [ -z "$dmg" ]; then
            echo "Downloading the iOS simulator runtime for $(xcodebuild -version | head -1)"
            mkdir -p ~/sim-runtime
            xcodebuild -downloadPlatform iOS -exportPath ~/sim-runtime
            dmg=$(ls ~/sim-runtime/*.dmg | head -n1)
            xcodebuild -importPlatform "$dmg"
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
          xcrun simctl list runtimes
          has_rt || { echo "::error::The iOS runtime is still older than 27.1 after import."; exit 1; }

      - name: Save iOS simulator runtime to the cache
        if: steps.runtime.outputs.downloaded == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sim-runtime
          key: ios-sim-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_BUILD }}

      # The image has no pre-made iOS 27.1 simulators, so create one. Use an
      # iPhone Duo device type if this Xcode ships one, otherwise the newest iPhone.
      - name: Create an iPhone simulator (iOS 27.1 or later)
        id: sim
        run: |
          echo "== Device types"; xcrun simctl list devicetypes
          echo "== Runtimes"; xcrun simctl list runtimes
          read -r RUNTIME DEVTYPE NAME <<< "$(python3 -c '
          import json, re, subprocess
          j = lambda *a: json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", *a]))
          def ver(s):
              m = re.match(r"(\d+)\.(\d+)", s)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          rts = [r for r in j("runtimes")["runtimes"]
                 if r.get("platform", "iOS") == "iOS" and r.get("isAvailable", True) and ver(r["version"]) >= (27, 1)]
          rts.sort(key=lambda r: ver(r["version"]))
          if not rts:
              print("", "", ""); raise SystemExit
          rt = rts[-1]
          supported = rt.get("supportedDeviceTypes") or j("devicetypes")["devicetypes"]
          phones = [d for d in supported if d["name"].startswith("iPhone")]
          duo = [d for d in phones if "Duo" in d["name"]]
          def model(d):
              m = re.match(r"iPhone (\d+)", d["name"])
              return (int(m.group(1)) if m else 0, "Pro" in d["name"], "Max" not in d["name"])
          phones.sort(key=model)
          order = duo + phones[::-1]
          print(rt["identifier"], ",".join(d["identifier"] + "=" + d["name"].replace(" ", "_") for d in order), "")
          ')"
          if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then
            echo "::error::No iOS 27.1+ simulator runtime with an iPhone device type on this image."
            exit 1
          fi
          # Try an iPhone Duo first, then the newest iPhone. Some device types are
          # listed but refuse to create on this runtime ("Incompatible device").
          SIM_ID=""
          for pair in ${DEVTYPE//,/ }; do
            NAME="${pair#*=}"
            if SIM_ID=$(xcrun simctl create "CI ${NAME//_/ }" "${pair%%=*}" "$RUNTIME" 2>sim.err); then break; fi
            echo "Could not create ${NAME//_/ }: $(cat sim.err)"; SIM_ID=""
          done
          [ -n "$SIM_ID" ] || { echo "::error::Could not create any iPhone simulator on $RUNTIME."; exit 1; }
          case "$NAME" in
            *Duo*) echo "::notice::Simulator: ${NAME//_/ } on $RUNTIME (iPhone Duo device type)." ;;
            *) echo "::notice::Simulator: ${NAME//_/ } on $RUNTIME. No iPhone Duo simulator could be created, so hinge paths run the no-hinge fallback." ;;
          esac
          xcrun simctl list devices | grep "$SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: xcodebuild build test
        run: |
          set -o pipefail
          xcodebuild \
            -project FoldFortune.xcodeproj \
            -scheme FoldFortune \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
