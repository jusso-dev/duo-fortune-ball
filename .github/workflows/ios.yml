name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: FortuneCore tests and app build (hosted macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcodes and SDKs
        run: |
          ls -d /Applications/Xcode*.app || true
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r); do
            echo "== $x"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version || true
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -i iphonesimulator || true
          done

      # The app targets iOS 27.1, the first SDK with the iPhone Duo hinge APIs
      # (DeviceHinge, onHingeChange). Pick the newest Xcode whose iOS simulator
      # SDK is 27.1 or later. If none is installed, fail loudly rather than fake a pass.
      - name: Select newest Xcode with the iPhone Duo SDK
        run: |
          picked=""
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r); do
            sdk=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)
            echo "$x -> iphonesimulator SDK ${sdk:-none}"
            if [ -n "$sdk" ] && [ "$(printf '%s\n27.1\n' "$sdk" | sort -V | head -1)" = "27.1" ]; then
              picked="$x"; break
            fi
          done
          if [ -z "$picked" ]; then
            echo "::error::No Xcode on this runner image has an iOS 27.1+ simulator SDK (needed for the iPhone Duo hinge APIs)."
            exit 1
          fi
          sudo xcode-select -s "$picked/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: FortuneCore swift test
        working-directory: Packages/FortuneCore
        run: swift test --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator (iOS 27.1 or later)
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(r):
              m = re.search(r"iOS-(\d+)-(\d+)", r)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          cands = [(ver(r), x["name"], x["udid"]) for r, v in d.items() if ver(r) >= (27, 1) for x in v if x["name"].startswith("iPhone")]
          cands.sort()
          duo = [c for c in cands if "Duo" in c[1]]
          pick = (duo or cands or [None])[-1]
          print(pick[2] if pick else "")
          ')
          if [ -z "$SIM_ID" ]; then
            echo "::error::No iPhone simulator with iOS 27.1+ is available on this image."
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl list devices | grep "$SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: xcodebuild build test
        run: |
          set -o pipefail
          xcodebuild \
            -project FoldFortune.xcodeproj \
            -scheme FoldFortune \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
